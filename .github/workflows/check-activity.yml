name: Corrigir Atividade

# Workflow reutilizável chamado pelos repositórios de atividade (ex: ECOM042-monitoria)
# via `uses: JoaoMatheusND/ECOM042-CI/.github/workflows/check-activity.yml@main`.
#
# Roda em runner hospedado pelo GitHub (ubuntu-latest) para testes iniciais do CI.
# O código do aluno precisa ter um west.yml (self.path: application) apontando pro
# manifest oficial do Zephyr, pra permitir `west init` sem workspace pré-existente.
#
# O gabarito (testcase.yaml/enunciado.md, que revela a resposta esperada) fica
# no repo privado ECOM042-atividades, não aqui — este repo precisa ser público
# pra `workflow_call` funcionar em repos de alunos fora da organização, mas o
# gabarito não pode ficar público junto. O checkout do ECOM042-atividades usa
# o secret ATIVIDADES_TOKEN (repassado pelo repo chamador via `secrets:
# inherit` ou explicitamente), um token com acesso de leitura só a esse repo.

on:
  workflow_call:
    inputs:
      atividade:
        description: "Nome da atividade (pasta em atividades/ deste repo) a validar"
        required: true
        type: string
      student_repository:
        description: >-
          Repositório (owner/repo) cujo código deve ser corrigido. Explícito
          (em vez de usar o checkout default) porque o caller roda em
          pull_request_target — sob esse evento, um checkout sem
          repository/ref pega a branch base, não o código do PR.
        required: true
        type: string
      student_ref:
        description: "SHA a checar out do student_repository (o head do PR, não a branch base)"
        required: true
        type: string
    secrets:
      ATIVIDADES_TOKEN:
        description: "Token com acesso de leitura ao repo privado ECOM042-atividades"
        required: true

jobs:
  corrigir:
    runs-on: ubuntu-latest
    env:
      # native_sim compila com o gcc do host, sem precisar do Zephyr SDK completo.
      ZEPHYR_TOOLCHAIN_VARIANT: host
      # `atividade` chega como nome de branch escolhido pelo aluno no fork
      # dele — não confiar nisso interpolado direto em `${{ }}` dentro de
      # `run:` (script injection: o valor vira texto do próprio comando
      # bash). Usar sempre como variável de ambiente ("$ATIVIDADE"), nunca
      # `${{ inputs.atividade }}` dentro de um bloco `run:`.
      ATIVIDADE: ${{ inputs.atividade }}
    steps:
      - name: Validar nome da atividade
        run: |
          if [[ ! "$ATIVIDADE" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "nome de atividade inválido: $ATIVIDADE" >&2
            exit 1
          fi

      - name: Checkout código do aluno
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.student_repository }}
          ref: ${{ inputs.student_ref }}
          persist-credentials: false
          path: zephyrproject/application

      - name: Checkout ECOM042-CI
        uses: actions/checkout@v4
        with:
          repository: JoaoMatheusND/ECOM042-CI
          persist-credentials: false
          path: ci

      - name: Checkout ECOM042-atividades (gabarito, privado)
        uses: actions/checkout@v4
        with:
          repository: JoaoMatheusND/ECOM042-atividades
          token: ${{ secrets.ATIVIDADES_TOKEN }}
          persist-credentials: false
          path: atividades

      - name: Conferir se atividade existe no ECOM042-atividades
        run: test -f "atividades/$ATIVIDADE/testcase.yaml"

      - name: Instalar clang-format
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-format

      - name: clang-format
        run: |
          find zephyrproject/application/src \( -name '*.c' -o -name '*.h' \) -print0 | \
            xargs -0 clang-format --style=file:ci/.clang-format --dry-run --Werror

      - name: Cache pip (west + requirements do Zephyr)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('zephyrproject/application/west.yml') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Instalar dependências do sistema (Zephyr + native_sim)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git cmake ninja-build gperf ccache dfu-util device-tree-compiler wget \
            python3-dev python3-pip python3-setuptools python3-tk python3-wheel xz-utils \
            file make gcc gcc-multilib g++-multilib libsdl2-dev libmagic1

      - name: Instalar west
        run: pip3 install --user -U west

      - name: Cache west workspace (zephyr + módulos)
        uses: actions/cache@v4
        with:
          path: |
            zephyrproject/zephyr
            zephyrproject/modules
            zephyrproject/bootloader
            zephyrproject/tools
          # revision: main no west.yml flutua, então a chave não muda entre PRs
          # diferentes que usam o mesmo manifest — o cache é reaproveitado e
          # `west update` só busca o delta (fetch incremental), não um clone
          # do zero. restore-keys cobre o caso de west.yml mudar.
          key: west-workspace-${{ hashFiles('zephyrproject/application/west.yml') }}
          restore-keys: |
            west-workspace-

      - name: west init / update
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          west init -l zephyrproject/application
          cd zephyrproject
          west update --narrow -o=--depth=1

      - name: Instalar requirements do Zephyr
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pip3 install --user -r zephyrproject/zephyr/scripts/requirements.txt

      - name: Cache ccache (objetos de build do Zephyr)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-native_sim-${{ hashFiles('zephyrproject/application/west.yml') }}
          restore-keys: |
            ccache-${{ runner.os }}-native_sim-

      - name: Build (west build)
        working-directory: zephyrproject
        env:
          CCACHE_DIR: /home/runner/.cache/ccache
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          west build -p always -b native_sim -s application -d /tmp/build

      - name: Copiar testcase.yaml da atividade
        run: cp "atividades/$ATIVIDADE/testcase.yaml" zephyrproject/application/testcase.yaml

      - name: Checagem estrutural (check.py, opcional)
        run: |
          CHECK="atividades/$ATIVIDADE/check.py"
          if [ -f "$CHECK" ]; then
            python3 "$CHECK" zephyrproject/application/src
          fi

      - name: Testes internos (Twister)
        working-directory: zephyrproject
        env:
          # disponível pro CMakeLists dos testes unitários incluírem código do aluno
          STUDENT_SRC_DIR: ${{ github.workspace }}/zephyrproject/application
          UNIT_DIR: ../atividades/${{ inputs.atividade }}/unit  # validado acima (regex), seguro interpolar
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ROOTS="-T application"
          if [ -f "$UNIT_DIR/testcase.yaml" ]; then
            ROOTS="$ROOTS -T $UNIT_DIR"
          fi
          west twister -p native_sim -v --inline-logs $ROOTS -O /tmp/twister-out
